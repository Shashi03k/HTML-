<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>classwork-3</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Personal Details</legend>
            <label for="Firstname">First Name:</label>
            <input type="text" name="Name" id="Firstname">
            <br>
            <br>
            <label for="middlename">Middle name :</label>
            <input type="text"  id="middlename">
            <br>
            <br>
            <label for="Lastname">Last name :</label>
            <input type="text"  id="Lastname">
            <br><br>
            <label for="course">Course :</label>
            <select name="course " id="course" aria-placeholder="course">
                <option value="BBA">BBA</option>
                <option value="BBA">BCA</option>
                <option value="MBA">MBA</option>
                <option value="BBA">B-tech</option>
                <option value="BBA">M-tech</option>
                <option value="MBA">MCA</option>
            </select>
            <br>
            <br>
            <!-- <span>Gender:</span>

            <input type="Radio" name="radio" id="radio">
            <label for="radio">male</label>

            <input type="Radio2" name="radio2" id="radio2">
            <label for="radio2">female</label>

            <input type="Radio3" name="radio3" id="radio3">
            <label for="radio3">prefer not to say</label> -->

            <span>Gender : </span>
            <input type="radio" name="gender" id="male">
            <label for="male">Male</label>
            
            <input type="radio" name="gender" id="female">
            <label for="female">Female</label>
            
            <input type="radio" name="gender" id="preferNotToSay">
            <label for="preferNotToSay">Prefer not to say</label>
            <br>
            <br>
            
            <label for="DOB">Date Of Birth : </label>
            <input type="datetime-local" name="Date of Birth" id="DOB">
            
            <br>
            <br>

            <label for="Phone">Phone : </label>
            <input type="tel" name="Phone" id="Phone" pattern="[0-9]{10}" placeholder="Enter 10 digit phone number">
           
            <br><br>
            <p>Address</p>
            <textarea name="address" id="" cols="30" rows="10"></textarea>

            <br><br>

            <label for="email">Email :</label>
            <input type="email" name="email" id="email">

            <br><br>

            <label for="Password">Password :</label>
            <input type="Password" name="Password" id="PAssword">
            <br>
            <br>
            <label for="Password">Re-type Password :</label>
            <input type="Password" name="Password" id="PAssword">
            <br><br>
            <input type="checkbox">
            <label for="">Agree turms and Conditions </label>
            <br>
            <label for="cp">choose file: </label>
            <input type="file" name="" id="cp">
            <br><br>
            <label for="cc">choose colour</label>
            <input type="color" name="" id="cc">
            <br>
           <input type="reset">
           <input type="button" name="submit" value="submit">






            
        </fieldset>
    </form>
</body>
</html>
